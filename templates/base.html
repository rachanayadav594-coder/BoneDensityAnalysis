<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bone Density App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/bd/dashboard">🦴 Bone Density App</a>
            <div class="navbar-nav ms-auto">
                {% if user %}
                <span class="navbar-text me-3 text-white-50">Welcome, {{ user }}!</span>
                {% endif %}
                {% block nav_right %}{% endblock %}
                {% if user %}
                <a class="nav-link" href="/auth/logout"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-3">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
