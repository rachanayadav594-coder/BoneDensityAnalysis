{% extends "base.html" %}

{% block title %}Bone Density Test{% endblock %}

{% block nav_right %}
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg">
            <div class="card-body p-4">
                <h2 class="text-center mb-4"><i class="bi bi-bone text-primary me-2"></i>Bone Density Test</h2>
                <form method="post" action="/bd/calculate">
                    <div class="mb-3">
                        <label for="age" class="form-label fw-bold fs-6 mb-1">Age (years)</label>
                        <input type="number" class="form-control form-control-lg" id="age" name="age" value="{{ last_result.age if last_result else '' }}" placeholder="Enter age" min="18" max="100" required>
                    </div>
                    <div class="mb-3">
                        <label for="weight_kg" class="form-label fw-bold fs-6 mb-1">Weight (kg)</label>
                        <input type="number" step="0.1" class="form-control form-control-lg" id="weight_kg" name="weight_kg" value="{{ last_result.weight_kg if last_result else '' }}" placeholder="Enter weight" required>
                    </div>
                    <div class="mb-3">
                        <label for="height_cm" class="form-label fw-bold fs-6 mb-1">Height (cm)</label>
                        <input type="number" step="0.1" class="form-control form-control-lg" id="height_cm" name="height_cm" value="{{ last_result.height_cm if last_result else '' }}" placeholder="Enter height" required>
                    </div>
                    <div class="mb-3">
                        <label for="gender" class="form-label fw-bold fs-6 mb-1">Gender</label>
                        <select class="form-select form-select-lg" name="gender" required>
                            <option value="" selected>{{ last_result.gender if last_result else 'Select gender' }}</option>
                            <option value="male" {{ 'selected' if last_result and last_result.gender == 'male' else '' }}>Male</option>
                            <option value="female" {{ 'selected' if last_result and last_result.gender == 'female' else '' }}>Female</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="activity_level" class="form-label fw-bold fs-6 mb-1">Activity Level</label>
                        <select class="form-select form-select-lg" name="activity_level" required>
                            <option value="sedentary" {{ 'selected' if last_result and last_result.get('activity_level') == 'sedentary' else '' }}>Sedentary</option>
                            <option value="moderate" {{ 'selected' if last_result and last_result.get('activity_level') == 'moderate' else '' }}>Moderate</option>
                            <option value="active" {{ 'selected' if last_result and last_result.get('activity_level') == 'active' else '' }}>Active</option>
                        </select>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-between">
                        <button type="submit" class="btn btn-primary btn-lg flex-fill">
                            Calculate
                        </button>
                        <a href="/bd/dashboard" class="btn btn-outline-secondary btn-lg ms-md-2 px-4">View Dashboard</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
